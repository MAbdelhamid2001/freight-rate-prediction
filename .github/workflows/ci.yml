name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --no-group train

      # The dataset is not in the repository: the suite trains on a synthetic
      # dataset (tests/conftest.py) and renders the app on the committed model.
      - name: Run tests
        run: uv run --no-sync pytest --cov=freight_rate --cov=api --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t freight-rate:ci .
      - name: Smoke test the API
        run: |
          docker run -d --name api -p 8000:8000 freight-rate:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -sf -X POST http://127.0.0.1:8000/api/predict -H 'Content-Type: application/json' \
            -d '{"pickup":"Lexington","delivery":"Fort Wayne","equipment":"Dry Van","date":"2025-12-15","distance":360,"weight":32000}'
